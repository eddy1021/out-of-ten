<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Out of Ten — Online Group Rating Party Game</title>
  <meta
    name="description"
    content="Rate your friends 0 to 10 on any topic from anywhere. Switch between self-rating or others-only, and choose anonymous or open votes before every round."
  />
  <meta name="theme-color" content="#F5F0E6" />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C94726'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='system-ui,sans-serif' font-size='14' font-weight='800' fill='%23FFFDFA'%3E10%3C/text%3E%3C/svg%3E"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar" id="app-topbar">
      <div class="topbar-inner">
        <a href="#/" class="brand" id="brand-link" aria-label="Out of Ten home">
          <span class="brand-mark" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <rect x="2" y="13" width="4" height="8" rx="1.2" fill="currentColor" opacity="0.45" />
              <rect x="10" y="9" width="4" height="12" rx="1.2" fill="currentColor" opacity="0.72" />
              <rect x="18" y="3" width="4" height="18" rx="1.2" fill="currentColor" />
            </svg>
          </span>
          <span class="brand-name">Out of Ten</span>
        </a>

        <div class="topbar-actions" id="topbar-actions">
          <button
            type="button"
            class="conn-pill"
            id="btn-connection-status"
            title="Switch between Local Demo and Online Firebase play"
          >
            <span class="conn-dot" aria-hidden="true"></span>
            <span id="conn-pill-label">Local Demo</span>
          </button>
        </div>
      </div>
    </header>

    <main class="main-stage" id="main-stage" tabindex="-1">
      <noscript>
        <section class="card card-padded">
          <h1>JavaScript Required</h1>
          <p>Out of Ten needs JavaScript enabled in your browser to run live rooms and tally votes.</p>
        </section>
      </noscript>
    </main>

    <footer class="site-footer" id="site-footer">
      <p>
        Whole numbers <strong>0–10</strong> · Locked rules before every round · No accounts or voice audio required
      </p>
    </footer>
  </div>

  <!-- Modal host -->
  <div class="modal-backdrop" id="modal-backdrop" hidden role="presentation">
    <div
      class="modal-panel"
      id="modal-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <button type="button" class="icon-btn" id="modal-close" aria-label="Close dialog">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer" hidden></div>
    </div>
  </div>

  <!-- Live toast stack -->
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
